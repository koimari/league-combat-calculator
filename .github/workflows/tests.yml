name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The three jobs are independent and run in parallel; wall time is the
# slowest job, not the sum.  `test` owns behavior (pytest, golden gate,
# acceptance matrices), `static` owns code quality and dependency/security
# scanning, `container` owns the production image.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -n auto

      - name: Verify numeric golden snapshot
        run: python scripts/golden_snapshot.py compare scripts/golden_baseline.json

      - name: Run backend acceptance matrices
        id: matrices
        run: |
          set +e
          mkdir -p artifacts/backend
          python scripts/acceptance_matrix.py --json > artifacts/backend/acceptance_matrix.json
          acceptance_status=$?
          python scripts/champion_optimizer_matrix.py --json > artifacts/backend/champion_optimizer_matrix.json
          champion_status=$?
          printf '{"acceptance_matrix":%s,"champion_optimizer_matrix":%s}\n' \
            "$acceptance_status" "$champion_status" \
            > artifacts/backend/status.json
          if [ "$acceptance_status" -ne 0 ] || [ "$champion_status" -ne 0 ]; then
            exit 1
          fi

      - name: Validate gate receipt schema
        # Runs even when a matrix gate is red — that is exactly when
        # consumers need trustworthy artifacts (issue #139).  Schema
        # validity is not the same as a green gate: a `passed: false`
        # receipt is valid and keeps its failure signal.  When the
        # matrices never ran (an earlier step failed), there is nothing
        # to validate and this step is skipped rather than adding a
        # missing-file failure on top of the real one.
        if: ${{ !cancelled() && steps.matrices.conclusion != 'skipped' }}
        run: |
          python scripts/validate_receipt.py             artifacts/backend/acceptance_matrix.json
          # TODO(issue #139): add champion_optimizer_matrix.json here once
          # the #139 envelope lands in scripts/champion_optimizer_matrix.py
          # (that file is owned by the #136/#145 fix batch this cycle).

      - name: Upload backend acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-acceptance-evidence
          path: artifacts/backend/
          if-no-files-found: warn

  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        run: black --check src/ tests/ scripts/

      - name: Run linter
        run: pylint src/ --jobs=0 --fail-under=9

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-runtime.txt

      - name: Scan Python source
        run: bandit -r src -ll

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag lol-calculator:ci .

      - name: Smoke production image
        run: |
          docker run --detach --name lol-calculator-smoke \
            --publish 127.0.0.1:18000:8000 lol-calculator:ci
          # On ANY failing exit — including `set -e` mid-script — dump the
          # container's own logs before cleanup.  A gunicorn worker-boot
          # death (arbiter exit 3) once reached the health gate with only
          # `docker inspect` output, and the worker's traceback was lost
          # with the container.
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs lol-calculator-smoke; fi; docker rm --force lol-calculator-smoke; exit "$status"' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec lol-calculator-smoke id -u)" != "0"
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"champion":"Aatrox"}' \
            http://127.0.0.1:18000/api/calculate \
            | grep --quiet '"total_damage"'

          # Issue #144: the beta metrics scorecard must ship in the runtime
          # package (scripts/ is excluded from the artifact).  Without a
          # Postgres DB the endpoint returns the distinct 503 "Database
          # unavailable"; the module-unavailable 503 is the deploy break.
          metrics="$(curl --silent --show-error http://127.0.0.1:18000/api/metrics)"
          if printf '%s' "$metrics" | grep --quiet 'Metrics module unavailable'; then
            echo "metrics module missing from the runtime package (issue #144)"
            exit 1
          fi
          printf '%s' "$metrics" | grep --quiet '"gate"' \
            || printf '%s' "$metrics" | grep --quiet 'Database unavailable'

          for attempt in {1..45}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' lol-calculator-smoke)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ] || [ "$attempt" = 45 ]; then
              docker inspect lol-calculator-smoke
              exit 1
            fi
            sleep 1
          done

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lol-calculator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
