name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Verify numeric golden snapshot
        run: python scripts/golden_snapshot.py compare scripts/golden_baseline.json

      - name: Run linter
        run: pylint src/ --fail-under=9

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-runtime.txt

      - name: Scan Python source
        run: bandit -r src -ll

  container:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag lol-calculator:ci .

      - name: Smoke production image
        run: |
          docker run --detach --name lol-calculator-smoke \
            --publish 127.0.0.1:18000:8000 lol-calculator:ci
          trap 'docker rm --force lol-calculator-smoke' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              docker logs lol-calculator-smoke
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec lol-calculator-smoke id -u)" != "0"
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"champion":"Aatrox"}' \
            http://127.0.0.1:18000/api/calculate \
            | grep --quiet '"total_damage"'

          for attempt in {1..45}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' lol-calculator-smoke)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ] || [ "$attempt" = 45 ]; then
              docker inspect lol-calculator-smoke
              exit 1
            fi
            sleep 1
          done

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lol-calculator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
