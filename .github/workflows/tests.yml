name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/sightline-zero]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs run independently, and each one runs the ci/ script that owns its
# checks, so a gate is spelled once and this file only provisions a runner.
# `make ci-full` runs the same scripts on a laptop (docs/ci-local.md).
# LCC_CI_STRICT makes a skipped check fail: every tool is installed here, so
# a skip would be a gate that silently did not run.

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Run the shared-ui gates
        run: bash ci/shared_ui.sh
        env:
          LCC_CI_STRICT: "1"
          LCC_CI_NPM_CI: "1"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # .python-version is the version's one home; every other reader
          # derives from it (tests/test_ci_homes.py).
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest, both golden compares, the backend acceptance matrices and the
      # receipt schema check over their artifacts. The script reports every
      # failure rather than stopping at the first, the way this job did.
      - name: Run the test gates
        run: bash ci/test.sh
        env:
          LCC_CI_PYTHON: python
          LCC_CI_STRICT: "1"

      - name: Upload backend acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-acceptance-evidence
          path: build/ci/backend/
          if-no-files-found: warn

  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the static gates
        run: bash ci/static.sh
        env:
          LCC_CI_PYTHON: python
          LCC_CI_STRICT: "1"

  coverage-census:
    # Every champion x fight mode, legally slotted item, keystone, and
    # certified-item x enemy cell through the real payload boundaries; the
    # committed receipt must reproduce.  ~180k cells, one champion per core,
    # spread over four runners so the job finishes inside the test job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the coverage census receipt (shard ${{ matrix.shard }}/4)
        run: bash ci/coverage_census.sh
        env:
          LCC_CI_PYTHON: python
          LCC_CI_STRICT: "1"
          LCC_CI_CENSUS_SHARD: ${{ matrix.shard }}/4

  property-sweep:
    # Rules every fight obeys (a longer fight never deals less, more armour
    # never deals more, a traced fight sums to its total, ...) over every
    # champion bare and in a seeded random legal build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep the fight properties (shard ${{ matrix.shard }}/4)
        run: bash ci/property_sweep.sh
        env:
          LCC_CI_PYTHON: python
          LCC_CI_STRICT: "1"
          LCC_CI_SWEEP_SHARD: ${{ matrix.shard }}/4

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker build, then the smoke against the running image: health,
      # non-root, one calculate, the metrics module, HEALTHCHECK healthy.
      # Strict like every other job: the script's trivy step is the one skip
      # it allows, because this job's next step is the scan as an action.
      - name: Build and smoke the production image
        run: bash ci/container.sh
        env:
          LCC_CI_STRICT: "1"

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lol-calculator:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
