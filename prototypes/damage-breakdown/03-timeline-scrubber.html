<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damage result · Timeline</title><style>
    :root{color-scheme:dark;--bg:#121212;--panel:#1a1a1a;--line:#383838;--ink:#f1f1f1;--muted:#9c9c9c;--red:#c5120b;--good:#c9e66b;--blue:#8ea6b6;--ui:Inter,ui-sans-serif,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#121212 0%,#1a1212 100%);color:var(--ink);font-family:var(--ui);min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(760px,100%)}.label{color:var(--red);font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}.panel{background:var(--panel);border:1px solid var(--line);padding:21px}.title{display:flex;justify-content:space-between;gap:16px;align-items:start}.title h1{margin:0;font-size:30px;letter-spacing:-.06em}.title span{color:var(--muted);font:10px var(--mono)}.answer{margin:14px 0 20px;color:var(--good);font-size:15px}.scrub{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:0 0 15px}.scrub output{font:700 15px var(--mono);min-width:43px}.scrub input{width:100%;accent-color:var(--red)}.hint{color:var(--muted);font:9px var(--mono)}.roster{display:grid;gap:13px}.row{display:grid;grid-template-columns:100px 1fr 120px;gap:12px;align-items:center}.row b{font-size:12px}.row small{display:block;color:var(--muted);font:9px var(--mono);margin-top:3px}.track{height:14px;background:#090909;border:1px solid #555}.track i{display:block;height:100%;background:var(--red);width:75%;transition:width .15s linear}.row.enemy .track i{background:var(--blue);width:0}.hp{font:600 11px var(--mono);text-align:right;white-space:nowrap}.events{display:flex;justify-content:space-between;position:relative;margin:23px 0 5px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font:9px var(--mono)}.events:before{content:"";position:absolute;top:-3px;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--red) 0 25%,#4b4b4b 25% 47%,var(--red) 47% 68%,#4b4b4b 68%)}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:16px}.meta div{background:#232323;padding:10px}.meta span{display:block;color:var(--muted);font:9px var(--mono);text-transform:uppercase}.meta b{display:block;margin-top:5px;font:600 13px var(--mono)}button{margin-top:18px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 10px;cursor:pointer;font:700 9px var(--mono);text-transform:uppercase}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}@media(max-width:600px){.row{grid-template-columns:80px 1fr}.hp{grid-column:2;text-align:left}.meta{grid-template-columns:1fr}.title{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){.track i{transition:none}}
  </style></head><body><main><p class="label">Prototype 03 · timeline scrubber</p><section class="panel"><div class="title"><h1 id="result">Akali wins</h1><span>event-ordered snapshot</span></div><p class="answer" id="answer">Orianna defeated at 6.8s</p><label class="scrub"><output id="time">10.0s</output><input id="slider" type="range" min="0" max="10" step="0.1" value="10" aria-label="Fight time"><span class="hint">/ 10s</span></label><div class="roster"><div class="row"><div><b>Akali</b><small>+6.4/s regen</small></div><div class="track"><i id="akali"></i></div><div class="hp" id="akaliHp">2,218 HP</div></div><div class="row enemy"><div><b>Orianna</b><small>+5.2/s · anti-heal 40%</small></div><div class="track"><i id="orianna"></i></div><div class="hp" id="oriannaHp">0 HP · defeated</div></div></div><div class="events"><span>0s · opening</span><span>4.5s · heal</span><span>6.8s · defeat</span><span>10s · end</span></div><div class="meta"><div><span>Akali</span><b>184 healed</b></div><div><span>Orianna</span><b>96 healed</b></div><div><span>Output</span><b>1,842 vs 1,710</b></div></div><button id="reset" type="button">Jump to end</button></section></main><script>const s=document.querySelector('#slider'),t=document.querySelector('#time'),a=document.querySelector('#akali'),o=document.querySelector('#orianna'),ah=document.querySelector('#akaliHp'),oh=document.querySelector('#oriannaHp'),ans=document.querySelector('#answer');function render(){const x=+s.value;t.textContent=x.toFixed(1)+'s';const ak=x<6.8?100-(x*3.2):75.4;const or=x<6.8?100-Math.min(100,x*12):0;a.style.width=Math.max(0,ak)+'%';o.style.width=Math.max(0,or)+'%';ah.textContent=x<6.8?Math.round(2940-(2940-2480)*(x/6.8)).toLocaleString()+' HP': '2,218 HP';oh.textContent=x<6.8?Math.round(2710*(1-x/6.8)).toLocaleString()+' HP': '0 HP · defeated';ans.textContent=x<6.8?'Live at '+x.toFixed(1)+'s · Orianna still in the fight':'Orianna defeated at 6.8s · Akali alive'}s.oninput=render;document.querySelector('#reset').onclick=()=>{s.value=10;render()};render();</script></body></html>
